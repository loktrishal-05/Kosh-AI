# Local stack: `docker compose -f infra/docker-compose.yml up -d`. Migrations in infra/migrations run on first boot.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxsetu
      POSTGRES_PASSWORD: taxsetu
      POSTGRES_DB: taxsetu
    ports: ["5432:5432"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxsetu"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: taxsetu, MINIO_ROOT_PASSWORD: taxsetu-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
