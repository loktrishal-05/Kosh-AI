[project]
name = "taxsetu-agents"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["taxsetu-engine", "taxsetu-mcp"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taxsetu_agents"]
