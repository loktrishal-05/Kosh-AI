[project]
name = "taxsetu-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "pydantic>=2", "taxsetu-engine", "taxsetu-mcp", "taxsetu-agents", "uvicorn", "cryptography"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taxsetu_api"]
