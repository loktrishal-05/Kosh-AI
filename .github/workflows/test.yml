name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pytest httpx fastapi pydantic -e packages/deterministic-tax-engine -e apps/api-gateway -e packages/mcp-servers -e packages/agents
      - run: pytest tests -q
