name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: taxsetu, POSTGRES_PASSWORD: taxsetu, POSTGRES_DB: taxsetu }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxsetu" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pytest httpx fastapi pydantic "psycopg[binary]" -e packages/deterministic-tax-engine -e apps/api-gateway -e packages/mcp-servers -e packages/agents
      - name: Apply migrations (as the table owner, in order)
        run: for f in infra/migrations/*.sql; do PGPASSWORD=taxsetu psql -h localhost -U taxsetu -d taxsetu -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pytest tests -q -rs
  workbench:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ca-workbench-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.18", cache: npm, cache-dependency-path: apps/ca-workbench-web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
